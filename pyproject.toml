[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-anonymizer"
version = "0.2.0"
description = "Desktop anonymizer for In.Plan SNP datasets; optional load into a target PostgreSQL"
requires-python = ">=3.11"
dependencies = ["psycopg2-binary>=2.9", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "psutil>=6", "pglast>=8"]

[project.scripts]
snp-anonymizer = "anonymizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anonymizer = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
