[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-anonymizer"
version = "0.1.0"
description = "Offline desktop anonymizer for In.Plan SNP datasets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "psutil>=6", "pglast>=8"]

[project.scripts]
snp-anonymizer = "anonymizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anonymizer = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
